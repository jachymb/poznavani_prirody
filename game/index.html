<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poznávání přírody</title>
<style>
  :root {
    --bg: #f2f7e8; --card: #fff; --ink: #24351f; --soft: #5d6f55; --brand: #2f7d4f; --brand-ink: #fff;
    --good: #1f8a4c; --good-bg: #dff5e4; --bad: #c2412d; --bad-bg: #fde6e0; --line: #d8e3cb; --sun: #f6b93b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #app { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100vh; }
  h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.1; margin: 28px 0 8px; color: var(--brand); }
  h2 { font-size: clamp(22px, 5vw, 28px); line-height: 1.2; margin: 4px 0 14px; }
  p { margin: 0 0 12px; }
  a { color: var(--brand); font-weight: 700; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .lead { color: var(--soft); font-size: 20px; }

  .continents { border: 0; margin: 20px 0 0; padding: 14px; background: var(--card); border-radius: 22px; min-width: 0; }
  .continents legend { float: left; width: 100%; padding: 0; margin-bottom: 8px; font-weight: 700; }
  .world { display: block; clear: both; width: 100%; height: auto; }
  .world path { fill: var(--land); stroke: var(--land); stroke-width: 1; cursor: pointer; }
  .world path:hover { filter: brightness(1.12); }
  .world path.off { fill: #d4dcc9; stroke: #d4dcc9; }
  .world path.off:hover { filter: brightness(.92); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px 4px 8px; background: var(--bg); border-radius: 12px; font-size: 16px; cursor: pointer; }
  .chip input { flex: none; width: 22px; height: 22px; margin: 0; }
  .chip:has(input:focus-visible) { outline: 3px solid var(--sun); outline-offset: 2px; }
  .options { border: 0; margin: 14px 0 0; padding: 14px; background: var(--card); border-radius: 22px; min-width: 0; }
  .options legend { float: left; width: 100%; padding: 0; margin-bottom: 8px; font-weight: 700; }
  .options .chips { clear: both; margin-top: 0; }
  .level { flex: 1 1 190px; }
  .level b, .level small { display: block; }
  .level small { color: var(--soft); font-size: 14px; }
  .note { margin-top: 12px; padding: 8px 12px; background: #fff4d6; border-radius: 12px; font-size: 15px; }
  .kingdoms { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 24px; }
  .kingdom { background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 24px 14px; text-align: center; font-weight: 700; font-size: 22px; transition: transform .12s, border-color .12s; }
  .kingdom .icon { display: block; font-size: 58px; line-height: 1.15; }
  .kingdom small { display: block; font-size: 15px; font-weight: 400; color: var(--soft); }
  .kingdom:not(:disabled):hover { transform: translateY(-3px); border-color: var(--brand); }
  .kingdom:disabled { opacity: .55; cursor: default; }
  .class-choice { margin-top: 24px; }
  .class-choice h2 { font-size: 22px; margin: 0 0 8px; }
  .class-choice h3 { font-size: 18px; margin: 14px 0 6px; }
  .groups { display: flex; flex-wrap: wrap; gap: 8px; }
  .group { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 12px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; font-size: 16px; font-weight: 700; }
  .group:hover { border-color: var(--brand); }
  .group-icon { flex: none; width: 22px; margin-right: 6px; font-size: 18px; line-height: 22px; text-align: center; }
  .group-icon svg { display: block; width: 22px; height: 22px; }
  .group small { margin-left: 5px; }
  .group small { font-weight: 400; color: var(--soft); }

  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 700; }
  .bar .home { background: none; border: 0; padding: 6px 8px; color: var(--soft); font-weight: 700; }
  .progress { flex: 1; height: 12px; background: var(--line); border-radius: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--brand); transition: width .25s; }
  .score, .count { white-space: nowrap; }
  .count { font-size: 15px; color: var(--soft); }

  .question { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: 0 2px 0 var(--line); }
  .prompt { color: var(--soft); font-weight: 700; margin-bottom: 8px; outline: none; }
  .statement { background: var(--bg); border-left: 6px solid var(--sun); border-radius: 10px; padding: 10px 14px; font-size: 21px; font-weight: 700; margin-bottom: 14px; }
  .single { display: block; width: 100%; max-height: 46vh; object-fit: contain; background: #eef2e6; border-radius: 16px; margin-bottom: 14px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answers { display: grid; gap: 10px; }
  .answers.names { grid-template-columns: 1fr 1fr; }
  @media (max-width: 480px) { .answers.names { grid-template-columns: 1fr; } }
  .answer { width: 100%; background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 12px 14px; font-weight: 700; text-align: left; min-height: 56px; }
  .answer:not(:disabled):hover { border-color: var(--brand); }
  .answer:disabled { cursor: default; }
  .tile { position: relative; padding: 0; overflow: hidden; text-align: center; }
  .tile .mark { position: absolute; top: 6px; right: 6px; margin: 0; padding: 2px 5px; background: var(--card); border-radius: 10px; }
  .tile img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #eef2e6; }
  .tile span { display: block; padding: 8px; font-size: 16px; }
  .answer.good { border-color: var(--good); background: var(--good-bg); }
  .answer.bad { border-color: var(--bad); background: var(--bad-bg); }
  .answer .mark { float: right; margin-left: 8px; }
  .answer.dim { opacity: .75; }

  .feedback { margin-top: 14px; padding: 14px 16px; border-radius: 16px; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .feedback h2 { margin: 0 0 6px; font-size: 22px; }
  .feedback a { color: #1c5a36; }
  .feedback .credit { font-size: 14px; color: #4a5a43; margin: 8px 0 0; }
  .feedback .credit a { color: inherit; font-weight: 400; }
  .primary { display: block; width: 100%; margin-top: 14px; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 16px; padding: 14px; font-weight: 700; font-size: 20px; }
  .primary:hover { filter: brightness(1.08); }
  .secondary { display: block; width: 100%; margin-top: 10px; background: var(--card); color: var(--brand); border: 3px solid var(--brand); border-radius: 16px; padding: 11px; font-weight: 700; font-size: 18px; }

  .result { text-align: center; padding-top: 28px; }
  .result .stars { font-size: 52px; line-height: 1.2; }
  .result .big { font-size: 42px; font-weight: 700; color: var(--brand); margin: 6px 0; }
  .result h2 { margin: 26px 0 10px; font-size: 22px; }
  .result button.link { background: none; border: 0; margin-top: 12px; min-height: 44px; color: var(--soft); font-weight: 700; text-decoration: underline; }
  .summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
  .summary li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 6px 12px 6px 6px; background: var(--card); border-left: 6px solid var(--good); border-radius: 12px; }
  .summary li.bad { border-left-color: var(--bad); background: var(--bad-bg); }
  .summary img { flex: none; width: 72px; height: 54px; object-fit: contain; background: #eef2e6; border-radius: 8px; }
  .summary .who { flex: 1; min-width: 0; }
  .summary .who a, .summary .who i { display: block; }
  .summary a { color: #1c5a36; }
  .summary .latin { font-size: 15px; }
  footer { margin-top: 28px; font-size: 14px; color: var(--soft); }
  .latin { font-weight: 400; }
  .answers.names .latin { display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main id="app"></main>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="quiz.js"></script>
<script>
  const ROUND = 10;
  const KINGDOMS = [
    { id: "zivocichove", label: "Živočichové", icon: "🦊" },
    { id: "rostliny", label: "Rostliny", icon: "🌿", note: "Neznámé rostliny nikdy neochutnávej a nesbírej jen podle této hry." },
    { id: "houby", label: "Houby", icon: "🍄", note: "Pozor: hra neučí sbírat houby. Nikdy nejez houbu, kterou neověřil dospělý znalec." },
  ];
  const CONTINENTS = [
    { code: "EU", name: "Evropa", color: "#3f7fb5" },
    { code: "AS", name: "Asie", color: "#d9822b" },
    { code: "AF", name: "Afrika", color: "#c4a21f" },
    { code: "NA", name: "Severní Amerika", color: "#3f9652" },
    { code: "SA", name: "Jižní Amerika", color: "#1f9a93" },
    { code: "AN", name: "Antarktida", color: "#7b93a8" },
    { code: "OC", name: "Austrálie a Oceánie", color: "#a85a9f" },
  ];
  // Ikony skupin: emoji, kde existuje vhodná a široce podporovaná, jinak malá vlastní kresba.
  const GROUP_ICONS = {
    savci: "🐻", ptaci: "🐦", plazi: "🦎", obojzivelnici: "🐸", ryby: "🐟", paryby: "🦈", hmyz: "🦋", pavoukovci: "🕷️", mekkysi: "🐌", korysi: "🦀",
    krouzkovci: "🪱", ostatni_zivocichove: "🐾",
    jehlicnany: "🌲", dalsi_nahosemenne: "🌴", vyssi_dvoudelozne: "🌻", jednodelozne: "🌷", kapradiny: "🌿", ostatni_rostliny: "🍃",
    stopkovytrusne: "🍄", ostatni_houby: "🦠",
  };
  const GROUP_DRAWINGS = {
    zahavci: '<path fill="#b78be8" d="M3 10a7 7 0 0 1 14 0c0 1-1.2 1.2-2.3.7-.9-.4-1.5 0-2.4.2-.9.2-1.6-.2-2.3-.2s-1.4.4-2.3.2c-.9-.2-1.5-.6-2.4-.2C4.200 11.200 3 11 3 10z"/><path fill="none" stroke="#8f62c9" stroke-width="1.300" stroke-linecap="round" d="M6 12.500c-.8 1.600.8 2.700 0 5M10 12.500c.8 1.600-.8 2.700 0 5.500M14 12.500c-.8 1.600.8 2.700 0 5"/>',
    stonozkovci: '<path fill="none" stroke="#7a4a21" stroke-width="1.100" stroke-linecap="round" d="M3 7.500 1.500 5M3.500 8 5 5.500M6 10.500 4 13M7.500 8.500 9 6M9.500 12 8 15M11 9.500 12.500 7M13 13.500 12 16.500M14.500 10.500 16.500 8.500M15.500 14 17.500 16"/><path fill="none" stroke="#a8622b" stroke-width="3.200" stroke-linecap="round" d="M3 7.500c2 3.500 4 3 6 3.500s3.500 2 6.500 2.500"/><circle cx="2.700" cy="6.900" r="1.900" fill="#7a4a21"/>',
    ostnokozci: '<path fill="#e8743b" stroke="#e8743b" stroke-width="2" stroke-linejoin="round" d="M10 2.500l2.200 5.200 5.600.5-4.300 3.700 1.300 5.500-4.800-2.900-4.800 2.900 1.300-5.500-4.300-3.700 5.600-.5z"/><g fill="#ffd2b5"><circle cx="10" cy="10" r="1"/><circle cx="10" cy="6.500" r=".7"/><circle cx="13.300" cy="9" r=".7"/><circle cx="12" cy="13" r=".7"/><circle cx="8" cy="13" r=".7"/><circle cx="6.700" cy="9" r=".7"/></g>',
    plostenci: '<path fill="#e6a6a0" stroke="#c97c75" stroke-width=".8" d="M2.500 12.500c1-4.500 4.500-6.500 7-5.500s3.700 3 5.500 1.500c1.300-1.100 2.500-.6 2.500.8s-1.700 3.700-5 4.200-5-1-6.500-.8-2.500 1.500-3.500-.2z"/><circle cx="14.700" cy="10" r=".5" fill="#6d3a36"/><circle cx="16" cy="9.800" r=".5" fill="#6d3a36"/>',
    nizsi_dvoudelozne: '<ellipse cx="10" cy="14.500" rx="8.500" ry="3" fill="#4f9a5b"/><path fill="#f3a5c2" d="M10 3c2 3 2.500 6 0 10-2.500-4-2-7 0-10z"/><path fill="#ec86ad" d="M4 7c3.500.5 5.500 2.500 6 6-3.500-.5-5.500-2.500-6-6zM16 7c-3.500.5-5.500 2.500-6 6 3.500-.5 5.500-2.500 6-6z"/><path fill="#f7c4d8" d="M2.500 11.500c3-.5 5.500 0 7.500 2-3 1-5.500.3-7.500-2zM17.500 11.500c-3-.5-5.500 0-7.500 2 3 1 5.500.3 7.500-2z"/><circle cx="10" cy="12.500" r="1.200" fill="#f6c945"/>',
    mechorosty: '<path fill="#3f8f4b" d="M1.500 17c0-3.500 2-5.500 4-5.500 1 0 1.700.4 2.200 1 .7-2.300 2.100-3.500 3.800-3.500 1.800 0 3.200 1.400 3.600 3.300.5-.4 1-.6 1.500-.6.8 0 1.900 1.400 1.900 5.300z"/><path fill="none" stroke="#7cc47f" stroke-width="1.100" stroke-linecap="round" d="M5 11.500V8.500M11.500 10V5M16 12.500V9"/><g fill="#a06b2c"><ellipse cx="5" cy="7.600" rx=".9" ry="1.300"/><ellipse cx="11.500" cy="4" rx=".9" ry="1.300"/><ellipse cx="16" cy="8" rx=".9" ry="1.300"/></g>',
    plavune: '<path fill="none" stroke="#3f8f4b" stroke-width="1.500" stroke-linecap="round" d="M10 18.500V8"/><path fill="none" stroke="#5aa864" stroke-width="1.300" stroke-linecap="round" d="M10 17l-3-1.800M10 17l3-1.800M10 14.500l-3-1.800M10 14.500l3-1.800M10 12l-3-1.800M10 12l3-1.800M10 9.800l-2.500-1.500M10 9.800l2.500-1.500"/><ellipse cx="10" cy="5" rx="1.700" ry="3.800" fill="#c9b458"/>',
    vreckovytrusne: '<path fill="#efe2c6" d="M7.800 11h4.400l.8 7c0 .8-6 .8-6 0z"/><path fill="#a97b45" d="M10 1.500c3.500 0 5.300 3.800 5.300 7.200 0 2.800-2.300 3.300-5.300 3.300s-5.300-.5-5.300-3.300C4.700 5.300 6.500 1.500 10 1.500z"/><path fill="none" stroke="#6b4a24" stroke-width=".9" d="M10 2v9.500M7.200 3.500c-.7 2.500-.8 5.500-.3 8M12.800 3.500c.7 2.500.8 5.500.3 8M5 7h10M4.900 10h10.200M6 4.700h8"/>',
  };
  function groupIcon(slug) {
    const icon = el("span", { class: "group-icon", ariaHidden: "true" });
    if (GROUP_DRAWINGS[slug]) icon.innerHTML = `<svg viewBox="0 0 20 20" width="20" height="20">${GROUP_DRAWINGS[slug]}</svg>`;
    else icon.textContent = GROUP_ICONS[slug] || "";
    return icon;
  }
  const selected = new Set(CONTINENTS.map((c) => c.code));
  const app = document.getElementById("app");
  const scrollBehavior = () => (window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
  const MAX_PHOTO_FAILURES = 3;
  let game = null;
  let level = "beginner";
  let textOnly = false;
  const questionOptions = () => ({ easy: level === "beginner", textOnly });

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "class") node.className = value;
      else if (key === "onclick") node.addEventListener("click", value);
      else node[key] = value;
    }
    node.append(...children.filter((c) => c !== null && c !== undefined));
    return node;
  }

  function classesOf(kingdom) {
    const all = (window.GAME_DATA || []).filter((c) => c.kingdom === kingdom);
    const here = window.Quiz.inContinents(all, selected);
    return (level === "beginner" ? window.Quiz.popularOnly(here) : here).filter((c) => c.species.length);
  }

  function kingdomButton(k) {
    const classes = classesOf(k.id);
    const playable = window.Quiz.makeQuestion(classes, questionOptions());
    const count = classes.reduce((sum, c) => sum + c.species.length, 0);
    const hasData = (window.GAME_DATA || []).some((c) => c.kingdom === k.id);
    const names = classes.length > 3 ? `${classes.length} ${classes.length < 5 ? "skupiny" : "skupin"}` : classes.map((c) => c.name).join(", ");
    return el("button", { class: "kingdom", disabled: !playable, onclick: () => startGame(k) },
      el("span", { class: "icon" }, k.icon),
      k.label,
      el("small", {}, playable ? `${names} · ${count} druhů` : hasData ? "Na vybraných kontinentech málo druhů" : "Už brzy"));
  }

  // Kvíz jen z jedné třídy. Nabízí se jen třídy, které při současném výběru jdou hrát.
  function classChoices() {
    const sections = KINGDOMS.map((k) => {
      const buttons = classesOf(k.id).filter((c) => window.Quiz.makeQuestion([c], questionOptions())).map((c) =>
        el("button", { class: "group", onclick: () => startGame(k, { classSlug: c.slug }) }, groupIcon(c.slug), c.name, " ", el("small", {}, String(c.species.length))));
      return buttons.length ? el("section", {}, el("h3", {}, `${k.icon} ${k.label}`), el("div", { class: "groups" }, ...buttons)) : null;
    });
    return [el("h2", {}, "Nebo si vyber jen jednu skupinu"), ...sections];
  }

  // Mapa je pro myš a dotyk; pro klávesnici a čtečky slouží zaškrtávací políčka pod ní.
  function continentPicker(onChange) {
    const { width, height, paths } = window.WORLD_MAP;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("class", "world");
    const boxes = new Map();
    const refresh = (code) => {
      svg.querySelector(`[data-code="${code}"]`).classList.toggle("off", !selected.has(code));
      boxes.get(code).checked = selected.has(code);
      onChange();
    };
    const toggle = (code) => {
      if (selected.has(code)) selected.delete(code);
      else selected.add(code);
      refresh(code);
    };
    for (const { code, name, color } of CONTINENTS) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", paths[name]);
      path.setAttribute("data-code", code);
      path.style.setProperty("--land", color);
      path.classList.toggle("off", !selected.has(code));
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = name;
      path.append(title);
      path.addEventListener("click", () => toggle(code));
      svg.append(path);
    }
    const chips = CONTINENTS.map(({ code, name, color }) => {
      const box = el("input", { type: "checkbox", checked: selected.has(code), onchange: () => toggle(code) });
      box.style.accentColor = color;
      boxes.set(code, box);
      return el("label", { class: "chip" }, box, name);
    });
    return el("fieldset", { class: "continents" },
      el("legend", {}, "Kde mají druhy žít? Kliknutím kontinent vypneš nebo zapneš."),
      svg,
      el("div", { class: "chips" }, ...chips));
  }

  function gameOptions(onChange) {
    const levelChoice = (value, label, hint) => el("label", { class: "chip level" },
      el("input", {
        type: "radio",
        name: "level",
        checked: level === value,
        onchange: () => { level = value; onChange(); },
      }),
      el("span", {}, el("b", {}, label), el("small", {}, hint)));
    return el("fieldset", { class: "options" },
      el("legend", {}, "Jak chceš hrát?"),
      el("div", { class: "chips" },
        levelChoice("beginner", "Začátečník", "známější a odlišnější druhy"),
        levelChoice("expert", "Znalec", "všechny druhy a blízcí příbuzní"),
        el("label", { class: "chip level" },
          el("input", { type: "checkbox", checked: textOnly, onchange: (e) => { textOnly = e.target.checked; onChange(); } }),
          el("span", {}, el("b", {}, "Bez fotek"), el("small", {}, "jen otázky s textem")))));
  }

  function showHome() {
    game = null;
    const kingdoms = el("div", { class: "kingdoms" });
    const classes = el("div", { class: "class-choice" });
    const renderKingdoms = () => {
      kingdoms.replaceChildren(...KINGDOMS.map(kingdomButton));
      classes.replaceChildren(...classChoices().filter(Boolean));
    };
    app.replaceChildren(
      el("h1", {}, "Poznávání přírody"),
      el("p", { class: "lead" }, "Poznáš, kdo je kdo? Vyber si, co chceš objevovat."),
      continentPicker(renderKingdoms),
      gameOptions(renderKingdoms),
      kingdoms,
      classes,
      el("footer", {}, "Texty a fotky pocházejí z Wikipedie a Wikimedia Commons. Mapa: Natural Earth."),
    );
    renderKingdoms();
  }

  // only: id druhů pro opakování chyb, jinak běžné kolo o ROUND otázkách. classSlug: hraje se jen tato třída.
  function startGame(kingdom, { only = null, classSlug = null } = {}) {
    const classes = classesOf(kingdom.id).filter((c) => !classSlug || c.slug === classSlug);
    const available = classes.reduce((sum, c) => sum + c.species.length, 0);
    game = {
      kingdom,
      classSlug,
      classes,
      only,
      // malá třída nemá dost druhů na celé kolo, ať se v něm neopakují
      total: only ? only.size : Math.min(ROUND, available),
      score: 0,
      asked: 0,
      seen: new Set(),
      history: [],
      photoFailures: 0,
      current: null,
    };
    nextQuestion();
  }

  function bar() {
    return el("div", { class: "bar" },
      el("button", { class: "home", onclick: showHome }, "← Domů"),
      el("div", { class: "progress" }, el("i", { style: `width:${(game.asked / game.total) * 100}%` })),
      el("span", { class: "count" }, `${game.asked} z ${game.total}`),
      el("span", { class: "score" }, `⭐ ${game.score}`),
    );
  }

  const announce = (text) => { document.getElementById("announce").textContent = text; };
  const speciesName = (s) => [s.name, " ", el("i", { class: "latin", lang: "la" }, s.latin)];
  const photoEl = (photo, alt, cls, onerror) => el("img", { src: photo.url, alt, className: cls || "", onerror });

  // Otázka s nenačtenou fotkou nejde poctivě hrát: vylosuje se jiná, opakovaně nabídneme hru bez fotek.
  function photoFailed(q) {
    if (game?.current !== q || q.done) return;
    q.done = true;
    game.asked--;
    game.photoFailures++;
    if (game.photoFailures < MAX_PHOTO_FAILURES) return nextQuestion();
    game.photoFailures = 0;
    const retry = el("button", { class: "primary", onclick: nextQuestion }, "Zkusit znovu");
    app.replaceChildren(bar(), el("section", { class: "question" },
      el("h1", {}, "Fotky se nepodařilo načíst"),
      el("p", {}, "Zkontroluj připojení k internetu, nebo pokračuj jen s textovými otázkami."),
      retry,
      el("button", { class: "secondary", onclick: () => { textOnly = true; nextQuestion(); } }, "Hrát bez fotek"),
    ));
    retry.focus({ preventScroll: true });
    announce("Fotky se nepodařilo načíst.");
  }

  function nextQuestion() {
    if (game.asked >= game.total) return showResult();
    const q = window.Quiz.makeQuestion(game.classes, { skip: game.seen, only: game.only, ...questionOptions() });
    if (!q) return showResult();
    game.current = q;
    game.seen.add(q.target.id);
    game.asked++;
    q.shownAt = performance.now();
    const failed = () => photoFailed(q);
    const answers = q.options.map((option, i) => {
      const onclick = () => answer(q, option, answers, card);
      const button = q.type === "findPhoto"
        ? el("button", { class: "answer tile", onclick }, photoEl(option.photo, `Fotka ${i + 1}`, "", failed))
        : q.type === "findSpecies" && !textOnly
          ? el("button", { class: "answer tile", onclick }, photoEl(option.photo, "", "", failed), el("span", {}, ...speciesName(option.species)))
          : q.type === "findName" || q.type === "findSpecies"
            ? el("button", { class: "answer", onclick }, ...speciesName(option.species))
            : el("button", { class: "answer", onclick }, option.text);
      button.option = option;
      return button;
    });
    const wrap = q.type === "findPhoto" || (q.type === "findSpecies" && !textOnly) ? "grid"
      : q.type === "findName" || q.type === "findSpecies" ? "answers names" : "answers";
    const prompt = el("div", { class: "prompt", tabIndex: -1 }, q.prompt);
    const card = el("section", { class: "question" },
      el("h1", { class: "sr-only" }, `Otázka ${game.asked} z ${game.total}`),
      prompt,
      q.highlight ? el("h2", {}, ...speciesName(q.target)) : null,
      q.statement ? el("div", { class: "statement" }, q.statement) : null,
      q.photo && !textOnly ? photoEl(q.photo, "Fotka hledaného druhu", "single", failed) : null,
      el("div", { class: wrap }, ...answers),
    );
    app.replaceChildren(bar(), card, game.kingdom.note ? el("p", { class: "note" }, game.kingdom.note) : "");
    window.scrollTo(0, 0);
    // Tlačítko „Další otázka“ zmizelo: fokus i hlášení čtečky přesuneme na novou otázku.
    prompt.focus({ preventScroll: true });
    announce(`Otázka ${game.asked} z ${game.total}. ${q.prompt} ${q.highlight || q.statement || ""}`);
  }

  function credit(photo) {
    const by = photo.author ? `${photo.author}, ` : "";
    return el("a", { href: photo.page, target: "_blank", rel: "noopener" }, `${by}${photo.license || "Wikimedia Commons"}`);
  }

  function answer(q, chosen, answers, card) {
    // Dvojklik na „Další otázka“ nesmí rovnou odpovědět na novou otázku.
    if (performance.now() - q.shownAt < 400 || q.done) return;
    q.done = true;
    game.photoFailures = 0;
    const right = window.Quiz.isCorrect(q, chosen);
    if (right) game.score++;
    game.history.push({ species: q.target, right });
    for (const button of answers) {
      const { option } = button;
      const correct = window.Quiz.isCorrect(q, option);
      button.disabled = true;
      button.classList.add(correct ? "good" : option === chosen ? "bad" : "dim");
      if (correct || option === chosen) {
        button.prepend(el("span", { class: "mark", ariaLabel: correct ? "správně" : "špatně" }, correct ? "✅" : "❌"));
      }
      if (q.type === "findPhoto") button.append(el("span", {}, ...speciesName(option.species)));
    }
    const shown = textOnly ? [] : q.photo ? [q.photo] : q.options.map((o) => o.photo).filter(Boolean);
    const fact = q.bonusFact;
    const lastOne = game.asked >= game.total;
    const lives = CONTINENTS.filter((c) => q.target.continents.includes(c.code)).map((c) => c.name).join(", ");
    const next = el("button", { class: "primary", onclick: nextQuestion }, lastOne ? "Ukázat výsledek" : "Další otázka →");
    const correctOption = q.options.find((o) => window.Quiz.isCorrect(q, o));
    const verdict = right ? "Správně! 🎉" : `Tentokrát ne. Správně je: ${q.type === "findFact" ? correctOption.text : q.target.name}`;
    announce(verdict);
    const box = el("div", { class: `feedback ${right ? "good" : "bad"}` },
      right || q.type === "findFact"
        ? el("h2", {}, verdict)
        : el("h2", {}, "Tentokrát ne. Správně je: ", ...speciesName(q.target)),
      right ? el("p", {}, ...speciesName(q.target)) : null,
      fact ? el("p", {}, `Zajímavost: ${fact}`) : null,
      el("p", {}, `Kde žije: ${lives}`),
      el("p", {}, el("a", { href: q.target.wiki, target: "_blank", rel: "noopener" }, "Přečti si víc na Wikipedii: ", ...speciesName(q.target))),
      shown.length ? el("p", { class: "credit" }, "Foto: ", ...shown.flatMap((p, i) => (i ? [" · ", credit(p)] : [credit(p)]))) : null,
    );
    card.append(box, next);
    app.querySelector(".score").textContent = `⭐ ${game.score}`;
    next.focus({ preventScroll: true });
    next.scrollIntoView({ behavior: scrollBehavior(), block: "nearest" });
  }

  function roundSummary() {
    return el("ul", { class: "summary" }, ...game.history.map(({ species, right }) => el("li", { class: right ? "good" : "bad" },
      textOnly ? null : el("img", { src: species.photos[0].url, alt: "", onerror: (e) => e.target.remove() }),
      el("span", { class: "who" },
        el("a", { href: species.wiki, target: "_blank", rel: "noopener" }, species.name),
        el("i", { class: "latin", lang: "la" }, species.latin)),
      el("span", { class: "mark", ariaLabel: right ? "správně" : "špatně" }, right ? "✅" : "❌"))));
  }

  function showResult() {
    const answered = game.history.length || 1;
    const share = game.score / answered;
    const stars = share >= 0.9 ? 3 : share >= 0.6 ? 2 : share >= 0.3 ? 1 : 0;
    const words = ["Nevzdávej to, příště to bude lepší!", "Dobrý začátek!", "Skvělá práce!", "Přírodu znáš opravdu výborně!"];
    const { kingdom, classSlug } = game;
    const missed = new Set(game.history.filter((h) => !h.right).map((h) => h.species.id));
    const scoreText = `${game.score} z ${game.history.length}`;
    announce(`Konec kola. ${scoreText}. ${words[stars]}`);
    const first = missed.size
      ? el("button", { class: "primary", onclick: () => startGame(kingdom, { only: missed, classSlug }) }, `Zopakovat chyby (${missed.size})`)
      : el("button", { class: "primary", onclick: () => startGame(kingdom, { classSlug }) }, "Hrát znovu");
    app.replaceChildren(el("section", { class: "result" },
      el("div", { class: "stars" }, "⭐".repeat(stars) || "🌱"),
      el("h1", { class: "big" }, scoreText),
      el("p", { class: "lead" }, words[stars]),
      first,
      missed.size ? el("button", { class: "secondary", onclick: () => startGame(kingdom, { classSlug }) }, "Hrát znovu") : null,
      el("h2", {}, "Druhy z tohoto kola"),
      roundSummary(),
      el("button", { class: "link", onclick: showHome }, "Zpět na výběr"),
    ));
    first.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  showHome();
</script>
</body>
</html>
