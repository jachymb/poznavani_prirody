<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poznávání přírody</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f7d4f'/><path d='M14 50C14 28 28 13 52 12c1 24-13 38-38 38z' fill='%23dff5e4'/><path d='M14 50 40 25' stroke='%232f7d4f' stroke-width='4' stroke-linecap='round'/><circle cx='47' cy='47' r='7' fill='%23f6b93b'/></svg>">
<style>
  :root {
    --bg: #f2f7e8; --card: #fff; --ink: #24351f; --soft: #5d6f55; --brand: #2f7d4f; --brand-ink: #fff;
    --good: #1f8a4c; --good-bg: #dff5e4; --bad: #c2412d; --bad-bg: #fde6e0; --line: #d8e3cb; --sun: #f6b93b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #app { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100vh; }
  h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.1; margin: 28px 0 8px; color: var(--brand); }
  h2 { font-size: clamp(22px, 5vw, 28px); line-height: 1.2; margin: 4px 0 14px; }
  p { margin: 0 0 12px; }
  a { color: var(--brand); font-weight: 700; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .lead { color: var(--soft); font-size: 20px; }

  .regions { border: 0; margin: 20px 0 0; padding: 14px; background: var(--card); border-radius: 22px; min-width: 0; }
  .regions legend { float: left; width: 100%; padding: 0; margin-bottom: 8px; font-weight: 700; }
  .world { display: block; clear: both; width: 100%; height: auto; }
  .world path { fill: var(--land); stroke: var(--land); stroke-width: 1; cursor: pointer; }
  .world path:hover { filter: brightness(1.12); }
  .world path.off { fill: #d4dcc9; stroke: #d4dcc9; }
  .world path.off:hover { filter: brightness(.92); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px 4px 8px; background: var(--bg); border-radius: 12px; font-size: 16px; cursor: pointer; }
  .chip input { flex: none; width: 22px; height: 22px; margin: 0; }
  .chip:has(input:focus-visible) { outline: 3px solid var(--sun); outline-offset: 2px; }
  .options { border: 0; margin: 14px 0 0; padding: 14px; background: var(--card); border-radius: 22px; min-width: 0; }
  .options legend { float: left; width: 100%; padding: 0; margin-bottom: 8px; font-weight: 700; }
  .options .chips { clear: both; margin-top: 0; }
  .level { flex: 1 1 190px; }
  .level b, .level small { display: block; }
  .level small { color: var(--soft); font-size: 14px; }
  .note { margin-top: 12px; padding: 8px 12px; background: #fff4d6; border-radius: 12px; font-size: 15px; }
  .kingdoms { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 24px; }
  .kingdom { background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 24px 14px; text-align: center; font-weight: 700; font-size: 22px; transition: transform .12s, border-color .12s; }
  .kingdom .icon { display: block; font-size: 58px; line-height: 1.15; }
  .kingdom small { display: block; font-size: 15px; font-weight: 400; color: var(--soft); }
  .kingdom:not(:disabled):hover { transform: translateY(-3px); border-color: var(--brand); }
  .kingdom:disabled { opacity: .55; cursor: default; }
  .class-choice { margin-top: 24px; }
  .class-choice h2 { font-size: 22px; margin: 0 0 8px; }
  .class-choice h3 { font-size: 18px; margin: 14px 0 6px; }
  .groups { display: flex; flex-wrap: wrap; gap: 8px; }
  .group { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 12px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; font-size: 16px; font-weight: 700; }
  .group:hover { border-color: var(--brand); }
  .group-icon { flex: none; width: 22px; margin-right: 6px; font-size: 18px; line-height: 22px; text-align: center; }
  .group-icon svg { display: block; width: 22px; height: 22px; }
  .group small { margin-left: 5px; }
  .group small { font-weight: 400; color: var(--soft); }

  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 700; }
  .bar .home { background: none; border: 0; padding: 6px 8px; color: var(--soft); font-weight: 700; }
  .progress { flex: 1; height: 12px; background: var(--line); border-radius: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--brand); transition: width .25s; }
  .score, .count { white-space: nowrap; }
  .count { font-size: 15px; color: var(--soft); }

  .question { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: 0 2px 0 var(--line); }
  .prompt { color: var(--soft); font-weight: 700; margin-bottom: 8px; outline: none; }
  .statement { background: var(--bg); border-left: 6px solid var(--sun); border-radius: 10px; padding: 10px 14px; font-size: 21px; font-weight: 700; margin-bottom: 14px; }
  .single { display: block; width: 100%; max-height: 46vh; object-fit: contain; background: #eef2e6; border-radius: 16px; margin-bottom: 14px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answers { display: grid; gap: 10px; }
  .answers.names { grid-template-columns: 1fr 1fr; }
  @media (max-width: 480px) { .answers.names { grid-template-columns: 1fr; } }
  .answer { width: 100%; background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 12px 14px; font-weight: 700; text-align: left; min-height: 56px; }
  button.answer:not(:disabled):hover { border-color: var(--brand); }
  .answer:disabled { cursor: default; }
  .tile { position: relative; padding: 0; overflow: hidden; text-align: center; }
  .tile .mark { position: absolute; top: 6px; right: 6px; margin: 0; padding: 2px 5px; background: var(--card); border-radius: 10px; }
  .tile img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #eef2e6; }
  .tile span { display: block; padding: 8px; font-size: 16px; }
  /* jméno druhu i věta jdou označit a zkopírovat i v tlačítku, tažení myší není odpověď */
  .answer .name, .answer .copy, .tile span { user-select: text; -webkit-user-select: text; cursor: text; }
  .tile .latin { display: block; }
  .result .settings { margin: -4px 0 18px; font-size: 15px; color: var(--soft); }
  .answer.good { border-color: var(--good); background: var(--good-bg); }
  .answer.bad { border-color: var(--bad); background: var(--bad-bg); }
  .answer .mark { float: right; margin-left: 8px; user-select: none; -webkit-user-select: none; }
  .answer.dim { opacity: .75; }
  .answer.wiki, .answer.wiki span { cursor: pointer; }
  .answer.wiki .name { text-decoration: underline; }

  .feedback { margin-top: 14px; padding: 14px 16px; border-radius: 16px; }
  .feedback.good { background: var(--good-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .feedback h2 { margin: 0 0 6px; font-size: 22px; }
  .feedback a { color: #1c5a36; }
  .feedback .credit { font-size: 14px; color: #4a5a43; margin: 8px 0 0; }
  .feedback .credit a { color: inherit; font-weight: 400; }
  .primary { display: block; width: 100%; margin-top: 14px; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 16px; padding: 14px; font-weight: 700; font-size: 20px; }
  .primary:hover { filter: brightness(1.08); }
  .secondary { display: block; width: 100%; margin-top: 10px; background: var(--card); color: var(--brand); border: 3px solid var(--brand); border-radius: 16px; padding: 11px; font-weight: 700; font-size: 18px; }

  .result { text-align: center; padding-top: 28px; }
  .result .stars { font-size: 52px; line-height: 1.2; }
  .result .big { font-size: 42px; font-weight: 700; color: var(--brand); margin: 6px 0; }
  .result h2 { margin: 26px 0 10px; font-size: 22px; }
  /* Oslava bezchybného kola: příroda se snáší shora a hvězdičky poskočí. Na ovládání nemá vliv. */
  .celebration { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 10; }
  .celebration span {
    position: absolute; top: -12vh; left: var(--x); font-size: var(--size); opacity: 0;
    animation: drift var(--time) ease-in var(--delay) forwards;
  }
  @keyframes drift {
    0% { transform: translate(0, 0) rotate(0); opacity: 0; }
    8% { opacity: 1; }
    30% { transform: translate(var(--sway), 34vh) rotate(calc(var(--spin) * .3)); }
    60% { transform: translate(calc(var(--sway) * -1), 72vh) rotate(calc(var(--spin) * .6)); }
    88% { opacity: 1; }
    100% { transform: translate(var(--sway), 120vh) rotate(var(--spin)); opacity: 0; }
  }
  .stars.perfect span { display: inline-block; animation: hop .8s ease-out var(--delay) 5 both; }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-22px) scale(1.4); }
  }
  /* Malá oslava správné odpovědi: z vybrané odpovědi vyletí 🎉, ⭐ a emoji druhu. */
  .burst { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 10; }
  .burst span {
    position: absolute; left: var(--x); top: var(--y); font-size: var(--size); opacity: 0;
    animation: burst 2.2s ease-out var(--delay) forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    20%, 70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .celebration, .burst { display: none; }
    .stars.perfect span { animation: none; }
  }
  .summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; text-align: left; }
  .summary li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 6px 12px 6px 6px; background: var(--card); border-left: 6px solid var(--good); border-radius: 12px; }
  .summary li.bad { border-left-color: var(--bad); background: var(--bad-bg); }
  .summary img { flex: none; width: 72px; height: 54px; object-fit: contain; background: #eef2e6; border-radius: 8px; }
  .summary .who { flex: 1; min-width: 0; }
  .summary .who a, .summary .who i { display: block; }
  .summary a { color: #1c5a36; }
  .summary .latin { font-size: 15px; }
  footer { margin-top: 28px; font-size: 14px; color: var(--soft); }
  .latin { font-weight: 400; }
  .answers.names .latin { display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main id="app"></main>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="quiz.js"></script>
<script>
  const ROUND = 10;
  const KINGDOMS = [
    { id: "zivocichove", label: "Živočichové", icon: "🦊" },
    { id: "rostliny", label: "Rostliny", icon: "🌱", note: "Neznámé rostliny nikdy neochutnávej a nesbírej jen podle této hry." },
    { id: "houby", label: "Houby", icon: "🍄", note: "Pozor: hra neučí sbírat houby. Nikdy nejez houbu, kterou neověřil dospělý znalec." },
  ];
  // Zvláštní skupiny jen ve výběru jedné skupiny: jejich druhy se do žádné říše nepočítají.
  const EXTRA = { id: "extra", label: "Extra", icon: "✨" };
  // Geo regiony: celý svět, kontinenty a Česko jako část Evropy (na mapě zvětšené, aby se na něj dalo kliknout).
  const WORLD = { code: window.Quiz.WORLD, name: "🌍 Celý svět" };
  const REGIONS = [
    { code: "EU", name: "Evropa", color: "#3f7fb5" },
    { code: "CZ", name: "Česko", color: "#c8463c", within: "EU" },
    { code: "AS", name: "Asie", color: "#d9822b" },
    { code: "AF", name: "Afrika", color: "#c4a21f" },
    { code: "NA", name: "Severní Amerika", color: "#3f9652" },
    { code: "SA", name: "Jižní Amerika", color: "#1f9a93" },
    { code: "AN", name: "Antarktida a její ostrovy", color: "#7b93a8" },
    { code: "OC", name: "Austrálie a Oceánie", color: "#a85a9f" },
  ];
  // Ikony skupin: emoji, kde existuje vhodná a široce podporovaná, jinak malá vlastní kresba.
  const GROUP_ICONS = {
    savci: "🐻", ptaci: "🐦", plazi: "🦎", obojzivelnici: "🐸", ryby: "🐟", paryby: "🦈", hmyz: "🦋", pavoukovci: "🕷️", mekkysi: "🐌", korysi: "🦀",
    ostatni_zivocichove: "🪼",
    nahosemenne: "🌲", rosidy: "🌹", asteridy: "🌻", ostatni_dvoudelozne: "🪷", jednodelozne: "🌷", vytrusne: "🌿", ostatni_rostliny: "🍃",
    stopkovytrusne: "🍄‍🟫", ostatni_houby: "🍂", vyhynula_zvirata: "🦖", mikroorganismy: "🦠", endoparaziti: "🪱",
  };
  // Co skupiny obsahují, ukáže se při najetí myší.
  const GROUP_HINTS = {
    savci: "Šelmy, kopytníci, primáti, hlodavci, netopýři a kaloni, kytovci, vačnatci a další: srstnatí živočichové, kteří kojí mláďata",
    ptaci: "Pěvci, dravci, sovy, papoušci, kachny a husy, bahňáci a racci, hrabaví, brodiví a další: opeření živočichové se zobákem",
    plazi: "Ještěři, hadi, želvy, krokodýli a hatérie: živočichové se šupinami nebo krunýřem",
    obojzivelnici: "Žáby, čolci a mloci a beznohé červory: většinou žijí ve vodě i na souši",
    ryby: "Kaprovité ryby, lososi, tresky, úhoři, sumci, jeseteři, akvarijní rybky, ryby korálových útesů a další",
    paryby: "Žraloci, rejnoci, trnuchy, manty a chiméry",
    hmyz: "Motýli, brouci, blanokřídlí (včely, vosy, mravenci), ploštice, vážky, mouchy, kobylky a sarančata a další",
    pavoukovci: "Pavouci, štíři, sekáči, klíšťata a roztoči",
    mekkysi: "Plži (hlemýždi, slimáci, mořští plži), mlži (perlorodka, hřebenatka, zéva) a hlavonožci (chobotnice, sépie, loděnky)",
    korysi: "Raci, krabi a humři, stínky a svinky, žábronožky, krill, vilejši a další",
    ostatni_zivocichove: "Žahavci (medúzy, sasanky, korály), ostnokožci (hvězdice, ježovky), kroužkovci (žížaly, pijavky), stonožky a mnohonožky, sumky a salpy, mihule a sliznatky, mořské houby, ploštěnci, chvostoskoci, ostrorep a další",
    nahosemenne: "Jehličnany, cykasy, jinan, chvojníky, liánovce a welwitschie: semena nemají ukrytá v plodu",
    vytrusne: "Kapradiny, přesličky, plavuně, šídlatky a mechorosty (mechy a játrovky): rozmnožují se výtrusy, ne semeny",
    rosidy: "Superrosidy, dvouděložné rostliny příbuzné růžím: růžovité (jabloně, třešně, růže), bobovité, brukvovité, buky, duby a břízy, javory, lípy a slézy, myrty, tykve, kakosty, lomikameny, réva a další",
    asteridy: "Superasteridy, dvouděložné rostliny příbuzné slunečnicím: hvězdnicovité (slunečnice, sedmikrásky), hluchavkovité, hvozdíkovité, kaktusy, vřesovcovité, miříkovité, lilkovité, hořcovité, brutnákovité a další",
    ostatni_dvoudelozne: "Dvouděložné mimo superrosidy a superasteridy: pryskyřníky a máky, magnólie, vavříny, pepř, lekníny, lotos, platany a další",
    jednodelozne: "Trávy, ostřice, lilie, orchideje, palmy, banánovníky a další rostliny s jedním děložním lístkem",
    stopkovytrusne: "Houby s kloboukem, jako hřiby, muchomůrky a holubinky, dále choroše, hvězdovky a další, včetně rzí a snětí",
    vreckovytrusne: "Smrže, ucháče, kališníky, dřevnatky, padlí a další, včetně lišejníků",
    vyhynula_zvirata: "Dinosauři, ptakoještěři, mamuti, trilobiti, amoniti a další zvířata, která už nežijí, i nedávno vyhynulá jako dronte nebo vakovlk. Na obrázcích jsou i fosílie a rekonstrukce",
    endoparaziti: "Tasemnice, motolice, škrkavky a další cizopasníci, kteří žijí uvnitř těl jiných živočichů. Na obrázcích jsou i preparáty, snímky z mikroskopu a lékařské fotografie",
    mikroorganismy: "Bakterie a sinice, archea, prvoci (měňavky, trepky, krásnoočka), rozsivky, obrněnky, mikroskopické zelené řasy, hlenky a další drobné organismy. Fotky jsou i snímky z mikroskopu",
  };
  const GROUP_DRAWINGS = {
    plostenci: '<path fill="#e6a6a0" stroke="#c97c75" stroke-width=".8" d="M2.500 12.500c1-4.500 4.500-6.500 7-5.500s3.700 3 5.500 1.500c1.300-1.100 2.500-.6 2.500.8s-1.700 3.700-5 4.200-5-1-6.500-.8-2.500 1.500-3.500-.2z"/><circle cx="14.700" cy="10" r=".5" fill="#6d3a36"/><circle cx="16" cy="9.800" r=".5" fill="#6d3a36"/>',
    vreckovytrusne: '<path fill="#d9b77e" stroke="#7a5a2e" stroke-width=".8" d="M7.800 11h4.400l.8 7c0 .8-6 .8-6 0z"/><path fill="#a97b45" d="M10 1.500c3.500 0 5.300 3.800 5.300 7.200 0 2.800-2.300 3.300-5.300 3.300s-5.300-.5-5.300-3.300C4.700 5.300 6.500 1.500 10 1.500z"/><path fill="none" stroke="#6b4a24" stroke-width=".9" d="M10 2v9.500M7.200 3.500c-.7 2.500-.8 5.500-.3 8M12.800 3.500c.7 2.500.8 5.500.3 8M5 7h10M4.900 10h10.200M6 4.700h8"/>',
  };
  function groupIcon(slug) {
    const icon = el("span", { class: "group-icon", ariaHidden: "true" });
    if (GROUP_DRAWINGS[slug]) icon.innerHTML = `<svg viewBox="0 0 20 20" width="20" height="20">${GROUP_DRAWINGS[slug]}</svg>`;
    else icon.textContent = GROUP_ICONS[slug] || "";
    return icon;
  }
  let region = WORLD.code;
  const app = document.getElementById("app");
  const scrollBehavior = () => (window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
  const MAX_PHOTO_FAILURES = 3;
  let game = null;
  let level = "advanced";
  const HARDER = { beginner: "advanced", advanced: "expert" };
  const LEVELS = {
    beginner: ["Začátečník", "jen nejznámější druhy, možnosti se hodně liší"],
    advanced: ["Pokročilý", "známé druhy, možnosti z příbuzných skupin"],
    expert: ["Znalec", "všechny druhy, možnosti z blízkých příbuzných"],
  };
  const regionName = (code) => (code === WORLD.code ? "celý svět" : REGIONS.find((r) => r.code === code).name);

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "class") node.className = value;
      else if (key === "onclick") node.addEventListener("click", value);
      else node[key] = value;
    }
    node.append(...children.filter((c) => c !== null && c !== undefined));
    return node;
  }

  function classesOf(kingdom) {
    const all = (window.GAME_DATA || []).filter((c) => c.kingdom === kingdom);
    const here = window.Quiz.inRegions(all, region);
    return window.Quiz.atLevel(here, level).filter((c) => c.species.length);
  }

  function kingdomButton(k) {
    const classes = classesOf(k.id);
    const playable = window.Quiz.makeQuestion(classes, { level });
    const count = classes.reduce((sum, c) => sum + c.species.length, 0);
    const hasData = (window.GAME_DATA || []).some((c) => c.kingdom === k.id);
    const names = `${classes.length} ${classes.length === 1 ? "skupina" : classes.length < 5 ? "skupiny" : "skupin"}`;
    return el("button", { class: "kingdom", disabled: !playable, onclick: () => startGame(k) },
      el("span", { class: "icon" }, k.icon),
      k.label,
      el("small", {}, playable ? `${names} · ${count} druhů` : hasData ? "Ve vybrané oblasti málo druhů" : "Už brzy"));
  }

  const GROUP_WARNINGS = {
    endoparaziti: "Některé fotografie v této kategorii můžou být znepokojivé. Ukazují cizopasníky i napadená těla lidí a zvířat.",
  };
  function showWarning(kingdom, classSlug) {
    const heading = el("h1", { tabIndex: -1 }, "⚠️ Upozornění");
    app.replaceChildren(
      heading,
      el("p", { class: "note" }, GROUP_WARNINGS[classSlug]),
      el("p", { class: "lead" }, "Opravdu chceš pokračovat?"),
      el("button", { class: "primary", onclick: () => startGame(kingdom, { classSlug }) }, "Ano, pokračovat"),
      el("button", { class: "secondary", onclick: showHome }, "Raději se vrátit"),
    );
    window.scrollTo(0, 0);
    heading.focus();
  }

  // Kvíz jen z jedné třídy. Nabízí se jen třídy, které při současném výběru jdou hrát.
  function classChoices() {
    const sections = [...KINGDOMS, EXTRA].map((k) => {
      const playable = classesOf(k.id).filter((c) => window.Quiz.makeQuestion([c], { level }));
      const buttons = playable.sort((a, b) => b.species.length - a.species.length).map((c) =>
        el("button", { class: "group", title: GROUP_HINTS[c.slug] || "", onclick: () => (GROUP_WARNINGS[c.slug] ? showWarning(k, c.slug) : startGame(k, { classSlug: c.slug })) },
          groupIcon(c.slug), c.name, " ", el("small", {}, String(c.species.length))));
      return buttons.length ? el("section", {}, el("h3", {}, `${k.icon} ${k.label}`), el("div", { class: "groups" }, ...buttons)) : null;
    });
    return [el("h2", {}, "Nebo si vyber jen jednu skupinu"), ...sections];
  }

  // Mapa je pro myš a dotyk; pro klávesnici a čtečky slouží zaškrtávací políčka pod ní.
  function regionPicker(onChange) {
    const { width, height, paths } = window.WORLD_MAP;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("class", "world");
    const radios = new Map();
    // Na mapě svítí vybraný region; s celým světem všechno, s Evropou i Česko, které je její částí.
    const lit = (r) => region === WORLD.code || region === r.code || region === r.within;
    const choose = (code) => {
      region = code;
      for (const r of REGIONS) svg.querySelector(`[data-code="${r.code}"]`).classList.toggle("off", !lit(r));
      for (const [key, radio] of radios) radio.checked = key === code;
      onChange();
    };
    for (const area of REGIONS) {
      const { code, name, color } = area;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", paths[name]);
      path.setAttribute("data-code", code);
      path.style.setProperty("--land", color);
      path.classList.toggle("off", !lit(area));
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = name;
      path.append(title);
      // druhé kliknutí na vybraný region vrací celý svět
      path.addEventListener("click", () => choose(region === code ? WORLD.code : code));
      svg.append(path);
    }
    const chip = (key, name, color) => {
      const radio = el("input", { type: "radio", name: "region", checked: key === region, onchange: () => choose(key) });
      if (color) radio.style.accentColor = color;
      radios.set(key, radio);
      return el("label", { class: "chip" }, radio, name);
    };
    return el("fieldset", { class: "regions" },
      el("legend", {}, "Kde mají druhy žít? Vyber kontinent nebo Česko na mapě, nebo celý svět."),
      svg,
      el("div", { class: "chips" }, ...[WORLD, ...REGIONS].map((r) => chip(r.code, r.name, r.color))));
  }

  function gameOptions(onChange) {
    const levelChoice = ([value, [label, hint]]) => el("label", { class: "chip level" },
      el("input", {
        type: "radio",
        name: "level",
        checked: level === value,
        onchange: () => { level = value; onChange(); },
      }),
      el("span", {}, el("b", {}, label), el("small", {}, hint)));
    return el("fieldset", { class: "options" },
      el("legend", {}, "Úroveň obtížnosti"),
      el("div", { class: "chips" }, ...Object.entries(LEVELS).map(levelChoice)));
  }

  function showHome() {
    game = null;
    const kingdoms = el("div", { class: "kingdoms" });
    const classes = el("div", { class: "class-choice" });
    const renderKingdoms = () => {
      kingdoms.replaceChildren(...KINGDOMS.map(kingdomButton));
      classes.replaceChildren(...classChoices().filter(Boolean));
    };
    app.replaceChildren(
      el("h1", {}, "Poznávání přírody"),
      el("p", { class: "lead" }, "Poznáš, kdo je kdo? Vyber si, co chceš objevovat."),
      regionPicker(renderKingdoms),
      gameOptions(renderKingdoms),
      kingdoms,
      classes,
      el("footer", {}, "Texty a fotky pocházejí z Wikipedie a Wikimedia Commons. Mapa: Natural Earth."),
    );
    renderKingdoms();
  }

  // only: id druhů pro opakování chyb, jinak běžné kolo o ROUND otázkách. classSlug: hraje se jen tato třída.
  function startGame(kingdom, { only = null, classSlug = null } = {}) {
    const classes = classesOf(kingdom.id).filter((c) => !classSlug || c.slug === classSlug);
    const available = classes.reduce((sum, c) => sum + c.species.length, 0);
    game = {
      kingdom,
      classSlug,
      classes,
      settings: `Obtížnost: ${LEVELS[level][0]} · Oblast: ${regionName(region)}`,
      only,
      // malá třída nemá dost druhů na celé kolo, ať se v něm neopakují
      total: only ? only.size : Math.min(ROUND, available),
      score: 0,
      asked: 0,
      seen: new Set(),
      history: [],
      photoFailures: 0,
      current: null,
    };
    nextQuestion();
  }

  function bar() {
    return el("div", { class: "bar" },
      el("button", { class: "home", onclick: showHome }, "← Domů"),
      el("div", { class: "progress" }, el("i", { style: `width:${(game.asked / game.total) * 100}%` })),
      el("span", { class: "count" }, `${game.asked} z ${game.total}`),
      el("span", { class: "score" }, `⭐ ${game.score}`),
    );
  }

  // Tažení myší (označení jména ke zkopírování) není kliknutí. Pozná se podle pohybu, ne podle označeného textu:
  // ten může zůstat označený odjinud a kliknutí na fotku by pak nefungovalo. Klávesnice (detail 0) je vždy kliknutí.
  let pressedAt = [0, 0];
  document.addEventListener("mousedown", (e) => { pressedAt = [e.clientX, e.clientY]; }, true);
  const dragged = (e) => e.detail > 0 && Math.hypot(e.clientX - pressedAt[0], e.clientY - pressedAt[1]) > 5;

  const announce = (text) => { document.getElementById("announce").textContent = text; };
  // Druh bez českého jména má jako jméno latinský název, ten se nemá opakovat.
  const speciesName = (s) => (s.name === s.latin ? [el("i", { lang: "la" }, s.latin)] : [s.name, " ", el("i", { class: "latin", lang: "la" }, s.latin)]);
  const photoEl = (photo, alt, cls, onerror) => el("img", { src: photo.url, alt, className: cls || "", onerror });

  // Otázka s nenačtenou fotkou nejde poctivě hrát: vylosuje se jiná, opakovaně nabídneme nový pokus.
  function photoFailed(q) {
    if (game?.current !== q || q.done) return;
    q.done = true;
    game.asked--;
    game.photoFailures++;
    if (game.photoFailures < MAX_PHOTO_FAILURES) return nextQuestion();
    game.photoFailures = 0;
    const retry = el("button", { class: "primary", onclick: nextQuestion }, "Zkusit znovu");
    app.replaceChildren(bar(), el("section", { class: "question" },
      el("h1", {}, "Fotky se nepodařilo načíst"),
      el("p", {}, "Zkontroluj připojení k internetu a zkus to znovu."),
      retry,
    ));
    retry.focus({ preventScroll: true });
    announce("Fotky se nepodařilo načíst.");
  }

  function nextQuestion() {
    if (game.asked >= game.total) return showResult();
    const q = window.Quiz.makeQuestion(game.classes, { skip: game.seen, only: game.only, level });
    if (!q) return showResult();
    game.current = q;
    game.seen.add(q.target.id);
    game.asked++;
    q.shownAt = performance.now();
    const failed = () => photoFailed(q);
    const answers = q.options.map((option, i) => {
      const onclick = (e) => dragged(e) || answer(q, option, answers, card);
      const button = q.type === "findPhoto"
        ? el("button", { class: "answer tile", onclick }, photoEl(option.photo, `${q.picture || "Fotka"} ${i + 1}`, "", failed))
        : q.type === "findSpecies"
          ? el("button", { class: "answer tile", onclick }, photoEl(option.photo, "", "", failed), el("span", {}, ...speciesName(option.species)))
          : q.type === "findName"
            ? el("button", { class: "answer", onclick }, el("span", { class: "name" }, ...speciesName(option.species)))
            : el("button", { class: "answer", onclick }, el("span", { class: "copy" }, option.text));
      button.option = option;
      return button;
    });
    const wrap = q.type === "findPhoto" || q.type === "findSpecies" ? "grid"
      : q.type === "findName" ? "answers names" : "answers";
    const prompt = el("div", { class: "prompt", tabIndex: -1 }, q.prompt);
    const card = el("section", { class: "question" },
      el("h1", { class: "sr-only" }, `Otázka ${game.asked} z ${game.total}`),
      prompt,
      q.highlight ? el("h2", {}, ...speciesName(q.target)) : null,
      q.statement ? el("div", { class: "statement" }, q.statement) : null,
      q.photo ? photoEl(q.photo, `${q.picture || "Fotka"} hledaného druhu`, "single", failed) : null,
      el("div", { class: wrap }, ...answers),
    );
    app.replaceChildren(bar(), card, game.kingdom.note ? el("p", { class: "note" }, game.kingdom.note) : "");
    window.scrollTo(0, 0);
    // Tlačítko „Další otázka“ zmizelo: fokus i hlášení čtečky přesuneme na novou otázku.
    prompt.focus({ preventScroll: true });
    announce(`Otázka ${game.asked} z ${game.total}. ${q.prompt} ${q.highlight || q.statement || ""}`);
  }

  function credit(photo) {
    const by = photo.author ? `${photo.author}, ` : "";
    return el("a", { href: photo.page, target: "_blank", rel: "noopener" }, `${by}${photo.license || "Wikimedia Commons"}`);
  }

  function answer(q, chosen, answers, card) {
    // Dvojklik na „Další otázka“ nesmí rovnou odpovědět na novou otázku.
    if (performance.now() - q.shownAt < 400 || q.done) return;
    q.done = true;
    game.photoFailures = 0;
    const right = window.Quiz.isCorrect(q, chosen);
    if (right) game.score++;
    if (right) burst(answers.find((b) => b.option === chosen), q.target.emoji);
    game.history.push({ species: q.target, right });
    const speciesChoice = q.type !== "findFact";
    for (const button of answers) {
      const { option } = button;
      const correct = window.Quiz.isCorrect(q, option);
      button.disabled = true;
      button.classList.add(correct ? "good" : option === chosen ? "bad" : "dim");
      if (correct || option === chosen) {
        button.prepend(el("span", { class: "mark", ariaLabel: correct ? "správně" : "špatně" }, correct ? "✅" : "❌"));
      }
      // Celá odpovězená možnost (fotka i jméno) otevře článek na Wikipedii. Není to <a>, protože text v odkazu nejde označit tažením.
      if (speciesChoice) {
        const open = () => window.open(option.species.wiki, "_blank", "noopener");
        button.replaceWith(el("div", {
          class: `${button.className} wiki`, role: "link", tabIndex: 0, title: "Přečíst na Wikipedii",
          onclick: (e) => dragged(e) || open(),
          onkeydown: (e) => e.key === "Enter" && open(),
        }, button.querySelector(".mark"), button.querySelector("img"), el("span", { class: "name" }, ...speciesName(option.species))));
      }
    }
    const shown = q.photo ? [q.photo] : q.options.map((o) => o.photo).filter(Boolean);
    const fact = q.bonusFact;
    const lastOne = game.asked >= game.total;
    const lives = REGIONS.filter((r) => q.target.regions.includes(r.code)).map((r) => r.name).join(", ");
    const next = el("button", { class: "primary", onclick: nextQuestion }, lastOne ? "Ukázat výsledek" : "Další otázka →");
    const correctOption = q.options.find((o) => window.Quiz.isCorrect(q, o));
    const verdict = right ? "Správně! 🎉" : `Tentokrát ne. Správně je: ${q.type === "findFact" ? correctOption.text : q.target.name}`;
    announce(verdict);
    const box = el("div", { class: `feedback ${right ? "good" : "bad"}` },
      right || q.type === "findFact"
        ? el("h2", {}, verdict)
        : el("h2", {}, "Tentokrát ne. Správně je: ", ...speciesName(q.target)),
      fact ? el("p", {}, `Zajímavost: ${fact}`) : null,
      el("p", {}, `Kde žije: ${lives}`),
      speciesChoice
        ? el("p", {}, "Přečti si víc na Wikipedii kliknutím na jméno druhu.")
        : el("p", {}, el("a", { href: q.target.wiki, target: "_blank", rel: "noopener" }, "Přečti si víc na Wikipedii: ", ...speciesName(q.target))),
      shown.length ? el("p", { class: "credit" }, "Foto: ", ...shown.flatMap((p, i) => (i ? [" · ", credit(p)] : [credit(p)]))) : null,
    );
    card.append(box, next);
    app.querySelector(".score").textContent = `⭐ ${game.score}`;
    next.focus({ preventScroll: true });
    next.scrollIntoView({ behavior: scrollBehavior(), block: "nearest" });
  }

  function roundSummary() {
    return el("ul", { class: "summary" }, ...game.history.map(({ species, right }) => el("li", { class: right ? "good" : "bad" },
      el("img", { src: species.photos[0].url, alt: "", onerror: (e) => e.target.remove() }),
      el("span", { class: "who" },
        el("a", { href: species.wiki, target: "_blank", rel: "noopener" }, species.name),
        species.name !== species.latin ? el("i", { class: "latin", lang: "la" }, species.latin) : null),
      el("span", { class: "mark", ariaLabel: right ? "správně" : "špatně" }, right ? "✅" : "❌"))));
  }

  const random = (from, to) => from + Math.random() * (to - from);
  const piece = (text, vars) => {
    const span = el("span", {}, text);
    for (const [name, value] of Object.entries(vars)) span.style.setProperty(name, value);
    return span;
  };

  function burst(button, emoji = "⭐") {
    const { left, top, width, height } = button.getBoundingClientRect();
    const at = { "--x": `${left + width / 2}px`, "--y": `${top + height / 2}px` };
    const around = ["🎉", "⭐", emoji, "🎉", "⭐", emoji].map((icon, i) => {
      const angle = (i / 6) * 2 * Math.PI + random(-0.3, 0.3), reach = random(90, 150);
      return piece(icon, { ...at, "--size": "40px", "--dx": `${Math.cos(angle) * reach}px`, "--dy": `${Math.sin(angle) * reach}px`, "--delay": `${random(0, 0.2)}s` });
    });
    const overlay = el("div", { class: "burst", ariaHidden: "true" },
      piece(emoji, { ...at, "--size": "68px", "--dx": "0px", "--dy": "-50px", "--delay": "0s" }), ...around);
    document.body.append(overlay);
    setTimeout(() => overlay.remove(), 3000);
  }

  // Snáší se emoji všech druhů z kola, dokola, aby jich bylo dost; mezi nimi 🎉 a ⭐.
  function celebration(emojis) {
    const icons = [...new Set(emojis), "🎉", "⭐"];
    // Na telefonu by jich stejný počet zakryl text.
    const pieces = Array.from({ length: Math.min(70, Math.round(window.innerWidth / 18)) }, (_, i) => piece(icons[i % icons.length], {
      "--x": `${random(0, 94)}%`, "--size": `${random(30, 60)}px`, "--time": `${random(5, 8)}s`,
      "--delay": `${random(0, 5)}s`, "--sway": `${random(-90, 90)}px`, "--spin": `${random(-360, 360)}deg`,
    }));
    const overlay = el("div", { class: "celebration", ariaHidden: "true" }, ...pieces);
    setTimeout(() => overlay.remove(), 14000);
    return overlay;
  }

  function showResult() {
    const answered = game.history.length || 1;
    const share = game.score / answered;
    const stars = share >= 0.9 ? 3 : share >= 0.6 ? 2 : share >= 0.3 ? 1 : 0;
    const words = ["Nevzdávej to, příště to bude lepší!", "Dobrý začátek!", "Skvělá práce!", "Přírodu znáš opravdu výborně!"];
    const { kingdom, classSlug } = game;
    const missed = new Set(game.history.filter((h) => !h.right).map((h) => h.species.id));
    const scoreText = `${game.score} z ${game.history.length}`;
    // Opakování chyb je jiná disciplína, oslavuje se jen celé kolo bez chyby.
    const perfect = !game.only && !missed.size && game.history.length === game.total;
    announce(`Konec kola. ${scoreText}. ${perfect ? "Bez jediné chyby! " : ""}${words[stars]}`);
    const first = missed.size
      ? el("button", { class: "primary", onclick: () => startGame(kingdom, { only: missed, classSlug }) }, `Zopakovat chyby (${missed.size})`)
      : el("button", { class: "primary", onclick: () => startGame(kingdom, { classSlug }) }, "Hrát znovu");
    app.replaceChildren(el("section", { class: "result" },
      perfect ? celebration(game.history.map((h) => h.species.emoji)) : null,
      perfect
        ? el("div", { class: "stars perfect" }, ...[0, 0.15, 0.3].map((delay) => {
          const star = el("span", {}, "⭐");
          star.style.setProperty("--delay", `${delay}s`);
          return star;
        }))
        : el("div", { class: "stars" }, "⭐".repeat(stars) || "🌱"),
      el("h1", { class: "big" }, scoreText),
      el("p", { class: "lead" }, perfect ? `Bez jediné chyby! ${words[stars]}` : words[stars]),
      el("p", { class: "settings" }, game.settings),
      first,
      missed.size ? el("button", { class: "secondary", onclick: () => startGame(kingdom, { classSlug }) }, "Hrát znovu") : null,
      HARDER[level] ? el("button", {
        class: missed.size ? "secondary" : "primary",
        onclick: () => { level = HARDER[level]; startGame(kingdom, { classSlug }); },
      }, "Hrát znovu s vyšší obtížností") : null,
      el("button", { class: missed.size ? "secondary" : "primary", onclick: showHome }, "Zpět na výběr"),
      el("h2", {}, "Druhy z tohoto kola"),
      roundSummary(),
    ));
    first.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  showHome();
</script>
</body>
</html>
